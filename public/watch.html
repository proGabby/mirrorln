<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mirrorln — Live Screen Viewer</title>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/viewer.css" />
</head>

<body class="viewer-body">
  <div class="viewer-viewport" id="viewer-container">
    <!-- Top Floating HUD -->
    <header class="viewer-top-hud">
      <div class="viewer-brand">
        <span>📡</span>
        <span>Mirrorln</span>
      </div>
      <div class="viewer-status">
        <span class="pulse-dot idle" id="stream-indicator"></span>
        <span id="stream-status-text">Connecting...</span>
      </div>
    </header>

    <!-- Center Status / Loading Overlay -->
    <div id="viewer-overlay" class="viewer-overlay">
      <div class="spinner" id="overlay-spinner"></div>
      <h2 id="overlay-heading">Connecting to Stream</h2>
      <p id="overlay-subtext">Negotiating encrypted WebRTC peer-to-peer connection.</p>
      <button id="retry-btn" class="btn btn-secondary hidden">Reconnect</button>
    </div>

    <!-- Live Stream Video Player (muted initially for iOS Safari autoplay compliance) -->
    <video id="remote-video" autoplay playsinline muted></video>

    <!-- Bottom Controls HUD -->
    <footer class="viewer-bottom-hud">
      <button id="unmute-btn" class="hud-btn hidden">
        🔊 Tap to Unmute
      </button>
      <button id="fullscreen-btn" class="hud-btn" title="Toggle Fullscreen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3">
          </path>
        </svg>
        Fullscreen
      </button>
    </footer>
  </div>

  <script type="module" src="/js/viewer.js"></script>
</body>

</html>
